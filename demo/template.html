<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Promo reel 9:16, 15 s. Every frame is a pure function of time t (seconds).
const W = 1080, H = 1920, DURATION = 15;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = 'Inter, "DejaVu Sans", sans-serif';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, len) => clamp((t - start) / len);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

function wrap(text, maxW, font) {
  ctx.font = font;
  const out = [];
  for (const para of text.split('\n')) {
    let line = '';
    for (const w of para.split(' ')) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
      else line = test;
    }
    out.push(line);
  }
  return out;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function background(t, d) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, d.bg1);
  g.addColorStop(1, d.bg2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // drifting glow blobs
  const blobs = [
    [0.2, 0.25, 520, 0.0], [0.85, 0.55, 600, 2.1], [0.4, 0.9, 480, 4.2]
  ];
  for (const [bx, by, r, ph] of blobs) {
    const x = W * bx + Math.sin(t * 0.6 + ph) * 90;
    const y = H * by + Math.cos(t * 0.5 + ph) * 120;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, d.accent + '55');
    rg.addColorStop(1, d.accent + '00');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }
  // diagonal moving lines
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  const off = (t * 60) % 120;
  for (let i = -H; i < W + H; i += 120) {
    ctx.beginPath();
    ctx.moveTo(i + off, 0);
    ctx.lineTo(i + off - H * 0.5, H);
    ctx.stroke();
  }
  ctx.restore();
}

// Scene 1: hook (0 - 3.6 s)
function sceneHook(t, d) {
  const out = prog(t, 3.2, 0.4);
  if (out >= 1) return;
  ctx.save();
  ctx.globalAlpha = 1 - out;
  ctx.translate(0, -easeInOut(out) * 200);
  const font = `800 118px ${FONT}`;
  const lines = wrap(d.hook, W - 160, font);
  const lh = 135;
  let y = H / 2 - (lines.length * lh) / 2 + 60;
  lines.forEach((ln, i) => {
    const p = easeOut(prog(t, 0.2 + i * 0.22, 0.55));
    ctx.save();
    ctx.globalAlpha *= p;
    ctx.translate(0, (1 - p) * 80);
    ctx.font = font;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(ln, W / 2, y + i * lh);
    ctx.restore();
  });
  // accent underline
  const ul = easeOut(prog(t, 0.9, 0.6));
  ctx.fillStyle = d.accent;
  ctx.fillRect(W / 2 - 200 * ul, y + lines.length * lh - 50, 400 * ul, 14);
  ctx.restore();
}

// Scene 2: three feature cards (3.6 - 10.6 s)
function sceneFeatures(t, d) {
  if (t < 3.5 || t > 10.8) return;
  const out = prog(t, 10.2, 0.5);
  ctx.save();
  ctx.globalAlpha = 1 - out;
  // header
  const hp = easeOut(prog(t, 3.6, 0.5));
  ctx.globalAlpha *= hp;
  ctx.font = `600 54px ${FONT}`;
  ctx.fillStyle = d.accent;
  ctx.textAlign = 'left';
  ctx.fillText(d.featuresTitle, 110, 560);
  ctx.globalAlpha = 1 - out;

  const cardH = 230, gap = 50, top = 640;
  d.features.forEach((f, i) => {
    const p = backOut(clamp(prog(t, 4.0 + i * 1.5, 0.7)));
    const a = clamp(prog(t, 4.0 + i * 1.5, 0.4));
    if (a <= 0) return;
    const y = top + i * (cardH + gap);
    const x = 80 - (1 - p) * 700;
    ctx.save();
    ctx.globalAlpha *= a;
    roundRect(x, y, W - 160, cardH, 36);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // check badge
    ctx.beginPath();
    ctx.arc(x + 115, y + cardH / 2, 52, 0, Math.PI * 2);
    ctx.fillStyle = d.accent;
    ctx.fill();
    ctx.strokeStyle = d.bg2;
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const ck = easeOut(prog(t, 4.4 + i * 1.5, 0.4));
    ctx.beginPath();
    const cx = x + 115, cy = y + cardH / 2;
    ctx.moveTo(cx - 22, cy + 2);
    if (ck < 0.4) {
      const k = ck / 0.4;
      ctx.lineTo(cx - 22 + 16 * k, cy + 2 + 18 * k);
    } else {
      ctx.lineTo(cx - 6, cy + 20);
      const k = (ck - 0.4) / 0.6;
      ctx.lineTo(cx - 6 + 32 * k, cy + 20 - 40 * k);
    }
    ctx.stroke();
    // text
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    const tfont = `700 58px ${FONT}`;
    const lines = wrap(f, W - 160 - 250, tfont);
    ctx.font = tfont;
    const startY = y + cardH / 2 - ((lines.length - 1) * 68) / 2 + 20;
    lines.forEach((ln, j) => ctx.fillText(ln, x + 210, startY + j * 68));
    ctx.restore();
  });
  ctx.restore();
}

// Scene 3: brand + CTA (10.6 - 15 s)
function sceneBrand(t, d) {
  if (t < 10.5) return;
  const p = easeOut(prog(t, 10.6, 0.8));
  const s = 0.85 + 0.15 * backOut(clamp(prog(t, 10.6, 0.8)));
  ctx.save();
  ctx.globalAlpha = p;
  ctx.translate(W / 2, 760);
  ctx.scale(s, s);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  const font = `900 128px ${FONT}`;
  const lines = wrap(d.name, W - 140, font);
  ctx.font = font;
  lines.forEach((ln, i) => ctx.fillText(ln, 0, i * 140 - ((lines.length - 1) * 140) / 2));
  ctx.restore();

  const tp = easeOut(prog(t, 11.2, 0.6));
  ctx.save();
  ctx.globalAlpha = tp;
  ctx.textAlign = 'center';
  ctx.font = `500 56px ${FONT}`;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  wrap(d.tagline, W - 200, ctx.font).forEach((ln, i) =>
    ctx.fillText(ln, W / 2, 1000 + i * 70 + (1 - tp) * 40));
  ctx.restore();

  // CTA button with pulse
  const bp = backOut(clamp(prog(t, 11.8, 0.6)));
  if (bp > 0) {
    const pulse = 1 + 0.04 * Math.sin((t - 12.4) * 6) * (t > 12.4 ? 1 : 0);
    ctx.save();
    ctx.translate(W / 2, 1260);
    ctx.scale(bp * pulse, bp * pulse);
    ctx.font = `800 60px ${FONT}`;
    const bw = Math.max(640, ctx.measureText(d.cta).width + 140);
    roundRect(-bw / 2, -80, bw, 160, 80);
    ctx.fillStyle = d.accent;
    ctx.fill();
    ctx.fillStyle = d.bg2;
    ctx.textAlign = 'center';
    ctx.fillText(d.cta, 0, 22);
    ctx.restore();
  }

  const ap = easeOut(prog(t, 12.4, 0.6));
  ctx.save();
  ctx.globalAlpha = ap;
  ctx.textAlign = 'center';
  ctx.font = `500 46px ${FONT}`;
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  wrap(d.address, W - 200, ctx.font).forEach((ln, i) =>
    ctx.fillText(ln, W / 2, 1470 + i * 60));
  ctx.restore();

  // fade to black at the very end for a clean loop
  const end = prog(t, 14.6, 0.4);
  if (end > 0) { ctx.fillStyle = `rgba(0,0,0,${end})`; ctx.fillRect(0, 0, W, H); }
}

function watermark() {
  ctx.save();
  ctx.font = `700 34px ${FONT}`;
  ctx.textAlign = 'right';
  roundRect(W - 470, 70, 400, 70, 35);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('DEMO · wersja próbna', W - 100, 117);
  ctx.restore();
}

window.renderFrame = function (t, d) {
  ctx.clearRect(0, 0, W, H);
  background(t, d);
  sceneHook(t, d);
  sceneFeatures(t, d);
  sceneBrand(t, d);
  if (d.watermark !== false) watermark();
};
window.DURATION = DURATION;
</script>
</body>
</html>
